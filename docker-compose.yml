services:
  # Yerel geliştirme için. Sunucuda mevcut PostgreSQL varsa bu servisi başlatmayın:
  # docker compose up -d --build redis minio ... backend-api frontend
  # veya: docker compose --profile local-db up -d
  postgres:
    profiles: ["local-db"]
    image: pgvector/pgvector:pg17
    container_name: fifriz-postgres
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-fifriz}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-fifriz}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fifriz-redis
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: fifriz-minio
    command: server /data --console-address ":9001"
    ports:
      # Host ports shifted to avoid clashing with an existing MinIO/service on :9000
      - "${MINIO_HOST_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-19001}:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: fifriz-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb local/fifiz-documents --ignore-existing
        echo "bucket fifiz-documents is ready"
    restart: "no"

  ollama:
    image: ollama/ollama
    container_name: fifriz-ollama
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama
    container_name: fifriz-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: /bin/sh
    command:
      - -c
      - |
        if ollama show bge-m3 >/dev/null 2>&1; then
          echo "bge-m3 model already present, skipping pull"
        else
          echo "pulling bge-m3 model (first run may take several minutes)..."
          ollama pull bge-m3
        fi
        echo "bge-m3 model is ready"
        if ollama show llama3.1:8b >/dev/null 2>&1; then
          echo "llama3.1:8b model already present, skipping pull"
        else
          echo "pulling llama3.1:8b model (first run may take several minutes)..."
          ollama pull llama3.1:8b
        fi
        echo "llama3.1:8b model is ready"
    restart: "no"

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fifriz-backend-api
    command: ["./api"]
    env_file:
      - .env.docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Host 3000 is often taken; container still listens on 3000 (frontend nginx uses backend-api:3000)
      - "${API_HOST_PORT:-13000}:3000"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fifriz-backend-worker
    command: ["./worker"]
    env_file:
      - .env.docker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      ollama:
        condition: service_started
      ollama-init:
        condition: service_completed_successfully
      backend-api:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: fifriz-frontend
    ports:
      - "${FRONTEND_HOST_PORT:-5173}:80"
    depends_on:
      backend-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ollama_data:
